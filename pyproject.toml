[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ml-gpu"
version = "0.1.0"
description = "LAN AI/ML Remote GPU Compute Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Remote ML GPU Team"}
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Configuration
    "pyyaml>=6.0.2",
    # Security
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    # HTTP client
    "httpx>=0.28.0",
    # GPU monitoring
    "pynvml>=12.0.0",
    # LAN discovery
    "zeroconf>=0.136.0",
    # Utilities
    "psutil>=6.1.0",
    "aiofiles>=24.1.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
ml = [
    "torch>=2.5.0",
    "tensorboard>=2.18.0",
    "jupyterlab>=4.3.0",
]

[project.scripts]
gpu-host = "gpu_host.cli:app"
gpu-client = "gpu_client.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dashboard" = ["static/**/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: tests requiring GPU hardware",
    "integration: integration tests",
    "security: security tests",
    "e2e: end-to-end tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
